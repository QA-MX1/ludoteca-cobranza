<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ludoteca de Cobranza</title>
<meta name="description" content="Tablero de consulta rápida para collectors de Crédito 365: objeciones, extensiones, consecuencias del no pago, enfoque firme y cierre.">
<script>
  /* Tema guardado antes de pintar, para evitar parpadeo */
  (function () {
    try {
      var t = localStorage.getItem('ludoteca-tema');
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  })();
</script>
<style>
:root {
  --font: "DM Sans", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Roboto, Arial, sans-serif;
  --bg: #F4F5FA; --surface: #FFFFFF; --surface-2: #EEF0F7;
  --ink: #0C122A; --ink-2: #39405F; --muted: #596184;
  --line: #DEE1EC; --line-2: #C6CADB;
  --brand: #6948EB; --brand-ink: #4A2BC8; --brand-tint: #EFEBFF;
  --resp: #6948EB; --resp-tint: #F2EFFF;
  --alt: #8D93B0;
  --firm: #BF4F08; --firm-tint: #FFF1E5;
  --no: #BE1C39; --no-tint: #FDEEF1;
  --close: #087A5F; --close-tint: #E4F5EE;
  --warn: #7E5700; --warn-line: #D9A520; --warn-tint: #FFF7DA;
  --mark: #FFDF6B; --mark-ink: #0C122A;
  --ph-bg: #E5DEFF; --ph-ink: #3A20AE;
  --phv-bg: #FFE7A8; --phv-ink: #6A4700;
  --focus: 0 0 0 3px rgba(105, 72, 235, .45);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C122A; --surface: #131A37; --surface-2: #1B2447;
    --ink: #EEF0FA; --ink-2: #C5CAE2; --muted: #9CA3C4;
    --line: #283260; --line-2: #3A4579;
    --brand: #A08EFF; --brand-ink: #C6BBFF; --brand-tint: rgba(160, 142, 255, .15);
    --resp: #A08EFF; --resp-tint: rgba(160, 142, 255, .11);
    --alt: #7C84AA;
    --firm: #FFA25E; --firm-tint: rgba(255, 162, 94, .10);
    --no: #FF7C91; --no-tint: rgba(255, 124, 145, .10);
    --close: #4CD3A4; --close-tint: rgba(76, 211, 164, .10);
    --warn: #F6CB5C; --warn-line: #C99A22; --warn-tint: rgba(246, 203, 92, .10);
    --mark: rgba(255, 214, 82, .42); --mark-ink: #FFFFFF;
    --ph-bg: rgba(160, 142, 255, .24); --ph-ink: #DCD3FF;
    --phv-bg: rgba(246, 203, 92, .22); --phv-ink: #FFE29A;
    --focus: 0 0 0 3px rgba(160, 142, 255, .55);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0C122A; --surface: #131A37; --surface-2: #1B2447;
  --ink: #EEF0FA; --ink-2: #C5CAE2; --muted: #9CA3C4;
  --line: #283260; --line-2: #3A4579;
  --brand: #A08EFF; --brand-ink: #C6BBFF; --brand-tint: rgba(160, 142, 255, .15);
  --resp: #A08EFF; --resp-tint: rgba(160, 142, 255, .11);
  --alt: #7C84AA;
  --firm: #FFA25E; --firm-tint: rgba(255, 162, 94, .10);
  --no: #FF7C91; --no-tint: rgba(255, 124, 145, .10);
  --close: #4CD3A4; --close-tint: rgba(76, 211, 164, .10);
  --warn: #F6CB5C; --warn-line: #C99A22; --warn-tint: rgba(246, 203, 92, .10);
  --mark: rgba(255, 214, 82, .42); --mark-ink: #FFFFFF;
  --ph-bg: rgba(160, 142, 255, .24); --ph-ink: #DCD3FF;
  --phv-bg: rgba(246, 203, 92, .22); --phv-ink: #FFE29A;
  --focus: 0 0 0 3px rgba(160, 142, 255, .55);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font: 400 17px/1.5 var(--font);
  color: var(--ink); background: var(--bg);
  display: flex; flex-direction: column; height: 100dvh; overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; }
a { color: inherit; }
:focus-visible { outline: none; box-shadow: var(--focus); border-radius: 8px; }
svg.i { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
mark { background: var(--mark); color: var(--mark-ink); border-radius: 3px; padding: 0 1px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- Encabezado ---------- */
.top { flex: none; background: var(--surface); border-bottom: 1px solid var(--line); z-index: 5; }
.top-in {
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto; grid-template-areas: "brand search tools";
  gap: 22px; align-items: center; padding: 12px 20px;
}
.brand { grid-area: brand; display: flex; align-items: center; gap: 14px; text-decoration: none; color: var(--ink); }
.logo { display: flex; align-items: center; gap: 5px; font-weight: 750; font-size: 1.12rem; letter-spacing: -.01em; }
.logo .ring { color: var(--brand); border: 2px solid var(--brand); border-radius: 999px; padding: 0 6px; font-size: .9rem; line-height: 1.4; }
.brand-txt { display: flex; flex-direction: column; line-height: 1.2; padding-left: 14px; border-left: 1px solid var(--line); }
.brand-txt strong { font-size: .98rem; font-weight: 700; }
.brand-txt span { font-size: .8rem; color: var(--muted); }
.search { grid-area: search; position: relative; max-width: 760px; }
.search input {
  width: 100%; height: 54px; border-radius: 12px; border: 2px solid var(--line-2);
  background: var(--surface); color: var(--ink); font: 500 1.1rem var(--font);
  padding: 0 96px 0 50px; -webkit-appearance: none; appearance: none;
}
.search input::placeholder { color: var(--muted); font-weight: 400; }
.search input::-webkit-search-cancel-button, .search input::-webkit-search-decoration { -webkit-appearance: none; appearance: none; display: none; }
.search input:focus { outline: none; border-color: var(--brand); box-shadow: var(--focus); }
.search .s-ico { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--muted); }
.search .s-ico svg.i { width: 22px; height: 22px; }
.s-clear {
  position: absolute; right: 52px; top: 50%; transform: translateY(-50%);
  border: 0; background: var(--surface-2); color: var(--ink-2); width: 32px; height: 32px; border-radius: 8px;
  display: none; align-items: center; justify-content: center; cursor: pointer;
}
.s-clear.on { display: inline-flex; }
.s-kbd {
  position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
  font: 600 .8rem var(--font); color: var(--muted); border: 1px solid var(--line-2); border-radius: 6px; padding: 2px 8px;
}
.tools { grid-area: tools; display: flex; align-items: center; gap: 10px; }
.icon-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  height: 44px; min-width: 44px; padding: 0 12px; border-radius: 10px;
  border: 1px solid var(--line-2); background: var(--surface); color: var(--ink-2); cursor: pointer; font-weight: 600; font-size: .9rem;
}
.icon-btn:hover { background: var(--surface-2); color: var(--ink); }

/* ---------- Estructura de 3 paneles ---------- */
.app {
  flex: 1; min-height: 0; display: grid;
  grid-template-columns: 240px 368px minmax(0, 1fr);
  grid-template-rows: minmax(0, 1fr);
  grid-template-areas: "nav list detail";
}
.nav { grid-area: nav; background: var(--surface); border-right: 1px solid var(--line); overflow: auto; padding: 14px 10px 24px; }
.list { grid-area: list; background: var(--surface); border-right: 1px solid var(--line); overflow: auto; }
.detail { grid-area: detail; overflow: auto; background: var(--bg); scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { .detail { scroll-behavior: auto; } }

.nav-item {
  display: flex; align-items: center; gap: 11px; width: 100%; padding: 10px 12px; border-radius: 10px;
  color: var(--ink-2); font-weight: 600; font-size: .96rem; text-decoration: none; line-height: 1.25;
}
.nav-item:hover { background: var(--surface-2); color: var(--ink); }
.nav-item[aria-current="true"] { background: var(--brand-tint); color: var(--brand-ink); }
.nav-item .n { margin-left: auto; color: var(--muted); font-size: .82rem; font-weight: 600; font-variant-numeric: tabular-nums; }
.nav-item[aria-current="true"] .n { color: var(--brand-ink); }
.nav-sep { height: 1px; background: var(--line); margin: 10px 8px; }

/* ---------- Lista ---------- */
.list-head { position: sticky; top: 0; z-index: 1; background: var(--surface); padding: 18px 20px 14px; border-bottom: 1px solid var(--line); }
.list-head h2 { margin: 0; font-size: 1.22rem; line-height: 1.25; letter-spacing: -.01em; }
.list-head p { margin: 4px 0 0; color: var(--muted); font-size: .9rem; line-height: 1.4; }
.list-head .syn { margin-top: 8px; font-size: .84rem; color: var(--ink-2); }
.row {
  display: block; width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--line);
  padding: 14px 20px 14px 22px; cursor: pointer; position: relative; text-decoration: none; color: var(--ink);
}
.row:hover { background: var(--surface-2); }
.row[aria-current="true"] { background: var(--brand-tint); }
.row[aria-current="true"]::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--brand); }
.row.kb { box-shadow: inset 0 0 0 2px var(--brand); }
.row-path { display: flex; align-items: center; gap: 6px; font-size: .8rem; color: var(--muted); font-weight: 600; margin-bottom: 3px; }
.row-path svg.i { width: 15px; height: 15px; color: var(--brand); }
.row-t { display: block; font-weight: 650; font-size: 1.02rem; line-height: 1.3; }
.row-s {
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  color: var(--muted); font-size: .9rem; line-height: 1.38; margin-top: 3px;
}
.row-snip { display: block; color: var(--ink-2); font-size: .9rem; line-height: 1.4; margin-top: 4px; }
.badges { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 7px; }
.badge { font-size: .74rem; font-weight: 700; padding: 2px 7px; border-radius: 6px; line-height: 1.5; }
.badge.esp { background: var(--warn-tint); color: var(--warn); box-shadow: inset 0 0 0 1px var(--warn-line); }
.badge.g3m { background: var(--brand-tint); color: var(--brand-ink); }
.empty { padding: 24px 20px; color: var(--ink-2); }
.empty p { margin: 0 0 14px; }

/* ---------- Detalle ---------- */
.d { max-width: 900px; padding: 26px 40px 96px; }
.back { display: none; margin-bottom: 14px; }
.crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: .88rem; color: var(--muted); }
.crumbs a { color: var(--brand-ink); font-weight: 650; text-decoration: none; }
.crumbs a:hover { text-decoration: underline; }
.d-title { font-size: 2rem; line-height: 1.16; letter-spacing: -.018em; font-weight: 750; margin: 8px 0 8px; outline: none; }
.arq { margin: 0; color: var(--ink-2); font-size: 1.02rem; }
.arq b { font-weight: 700; color: var(--ink); }
.sit { margin: 10px 0 0; color: var(--ink-2); font-size: 1.04rem; max-width: 70ch; }
.d .badges { margin-top: 10px; }

.sec { margin-top: 22px; }
.lbl { margin: 0 0 8px; font-size: .9rem; font-weight: 750; color: var(--muted); letter-spacing: .005em; }
.quotes { display: flex; flex-wrap: wrap; gap: 8px; }
.quote {
  background: var(--surface); border: 1px solid var(--line-2); border-radius: 16px 16px 16px 4px;
  padding: 8px 14px; font-size: 1.04rem; line-height: 1.4;
}
.quote::before { content: "«"; color: var(--muted); margin-right: 2px; }
.quote::after { content: "»"; color: var(--muted); margin-left: 2px; }

.blk { margin-top: 18px; border-left: 5px solid var(--c); background: var(--t); border-radius: 6px 14px 14px 6px; padding: 14px 20px 18px; }
.blk-h { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 6px; min-height: 36px; }
.blk-h h3 { margin: 0; font-size: .95rem; font-weight: 800; color: var(--c); letter-spacing: .005em; }
.script { margin: 0; font-size: 1.3rem; line-height: 1.52; font-weight: 450; color: var(--ink); max-width: 64ch; }
.script.sm { font-size: 1.13rem; line-height: 1.5; }
.note { margin: 8px 0 0; font-size: .92rem; color: var(--ink-2); font-style: italic; }
.tag-lbl { display: block; font-size: .84rem; font-weight: 750; color: var(--ink-2); margin-bottom: 2px; }
.resp { --c: var(--resp); --t: var(--resp-tint); }
.firm { --c: var(--firm); --t: var(--firm-tint); }
.clos { --c: var(--close); --t: var(--close-tint); }
.alt { --c: var(--muted); --t: var(--surface); }
.nod { --c: var(--no); --t: var(--no-tint); }
.cont { --c: var(--brand); --t: var(--surface); }
.g3b { --c: var(--ink); --t: var(--surface); box-shadow: inset 0 0 0 1px var(--line-2); }
.g3-tag { display: inline-block; background: var(--ink); color: var(--surface); font-size: .76rem; font-weight: 800; padding: 2px 8px; border-radius: 6px; margin-right: 8px; vertical-align: 1px; }
.blk.alt .sub + .sub, .blk.clos .sub + .sub, .frases .sub + .sub { border-top: 1px solid var(--line); margin-top: 12px; padding-top: 12px; }
.sub-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; }
.sub-row > div { min-width: 0; }

.copy {
  display: inline-flex; align-items: center; gap: 7px; flex: none;
  border: 1.5px solid var(--c, var(--brand)); color: var(--c, var(--brand)); background: var(--surface);
  padding: 7px 13px; border-radius: 9px; font-weight: 750; font-size: .88rem; cursor: pointer; white-space: nowrap; line-height: 1.2;
}
.copy svg.i { width: 17px; height: 17px; }
.copy:hover { background: var(--c, var(--brand)); color: var(--surface); }
.copy.sm { padding: 5px 10px; font-size: .82rem; }
.copy.done, .copy.done:hover { background: var(--close); border-color: var(--close); color: var(--surface); }

.ph { background: var(--ph-bg); color: var(--ph-ink); border-radius: 6px; padding: 0 4px; font-weight: 650; white-space: nowrap; font-size: .92em; }

.checks { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.checks span { display: inline-flex; align-items: center; gap: 5px; font-size: .84rem; font-weight: 700; color: var(--close); background: var(--surface); border: 1px solid var(--line); padding: 3px 10px; border-radius: 999px; }
.checks svg.i { width: 15px; height: 15px; }

.nod ul { list-style: none; margin: 0; padding: 0; }
.nod li { display: grid; grid-template-columns: 22px minmax(0, 1fr); column-gap: 10px; padding: 9px 0; }
.nod li + li { border-top: 1px solid var(--line); }
.nod .x { color: var(--no); font-weight: 800; font-size: 1.05rem; line-height: 1.45; }
.nod .f { font-weight: 650; font-size: 1.06rem; line-height: 1.45; }
.nod .w { grid-column: 2; color: var(--ink-2); font-size: .93rem; margin-top: 1px; }

.aviso { margin-top: 18px; border-radius: 12px; padding: 14px 18px 16px; }
.aviso h3 { margin: 0; font-size: 1.04rem; font-weight: 800; display: flex; gap: 8px; align-items: center; }
.aviso p { margin: 6px 0 0; }
.aviso ol { margin: 10px 0 0; padding-left: 22px; }
.aviso li { margin: 4px 0; font-size: 1.02rem; }
.aviso.especial { background: var(--warn-tint); border: 2px solid var(--warn-line); }
.aviso.especial h3 { color: var(--warn); }
.aviso.importante { background: var(--no-tint); border: 1px solid var(--no); }
.aviso.importante h3 { color: var(--no); }
.aviso.nota { background: var(--brand-tint); }
.aviso.nota h3 { color: var(--brand-ink); }
.aviso .frase { margin-top: 12px; background: var(--surface); border-radius: 10px; padding: 10px 14px; }

.steps { list-style: none; margin: 0; padding: 0; counter-reset: st; }
.steps > li { counter-increment: st; position: relative; padding: 0 0 18px 50px; }
.steps > li::before {
  content: counter(st); position: absolute; left: 0; top: 0; width: 34px; height: 34px; border-radius: 999px;
  background: var(--brand); color: var(--surface); font-weight: 800; display: grid; place-items: center; font-size: .95rem;
}
.steps > li:not(:last-child)::after { content: ""; position: absolute; left: 16px; top: 38px; bottom: 4px; width: 2px; background: var(--line-2); }
.steps h4 { margin: 4px 0 4px; font-size: 1.06rem; font-weight: 750; }
.steps ul { margin: 2px 0 0; padding-left: 18px; color: var(--ink-2); }
.steps .stx { margin-top: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; }
.go { display: inline-flex; align-items: center; gap: 6px; margin-top: 6px; font-weight: 700; font-size: .9rem; color: var(--brand-ink); text-decoration: none; }
.go:hover { text-decoration: underline; }

.card { margin-top: 18px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px 20px 18px; }
.card > .lbl { margin-bottom: 12px; }
.plain { margin: 0; padding-left: 20px; }
.plain li { margin: 4px 0; }

.guia-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px 22px; padding: 14px 0; }
.guia-row + .guia-row { border-top: 1px solid var(--line); }
.g-h { display: flex; align-items: center; gap: 6px; font-size: .84rem; font-weight: 800; margin-bottom: 4px; }
.g-si .g-h { color: var(--close); }
.g-no .g-h { color: var(--no); }
.g-txt { font-size: 1.08rem; line-height: 1.45; }
.g-pq { grid-column: 1 / -1; color: var(--ink-2); font-size: .93rem; }
.g-pq b { font-weight: 750; }

.links { display: flex; flex-wrap: wrap; gap: 8px; }
.pill {
  display: inline-flex; align-items: center; gap: 6px; text-decoration: none; color: var(--ink);
  background: var(--surface); border: 1.5px solid var(--line-2); border-radius: 999px; padding: 7px 14px; font-weight: 600; font-size: .95rem;
}
.pill:hover { border-color: var(--brand); color: var(--brand-ink); }

/* ---------- Inicio ---------- */
.home h1 { font-size: 2.05rem; line-height: 1.15; letter-spacing: -.02em; margin: 6px 0 6px; }
.home .lead { margin: 0; color: var(--ink-2); font-size: 1.06rem; }
.chips { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
.chip {
  border: 1.5px solid var(--line-2); background: var(--surface); color: var(--ink); text-decoration: none;
  padding: 11px 17px; border-radius: 14px 14px 14px 4px; font-size: 1.03rem; font-weight: 600; cursor: pointer; line-height: 1.25;
}
.chip:hover { border-color: var(--brand); color: var(--brand-ink); }
.flow { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; counter-reset: fl; }
.flow li { counter-increment: fl; }
.flow a {
  display: flex; flex-direction: column; gap: 8px; height: 100%; text-decoration: none; color: var(--ink);
  background: var(--surface); border: 1px solid var(--line); border-top: 4px solid var(--brand); border-radius: 6px 6px 12px 12px; padding: 12px 14px;
  font-weight: 700; font-size: .98rem; line-height: 1.3;
}
.flow a::before { content: counter(fl); font-size: .82rem; color: var(--brand-ink); font-weight: 800; }
.flow a:hover { border-color: var(--brand); }
.remind { list-style: none; margin: 0; padding: 0; }
.remind li + li { border-top: 1px solid var(--line); }
.remind a { display: flex; align-items: center; gap: 10px; padding: 11px 2px; text-decoration: none; color: var(--ink); font-weight: 600; font-size: 1.03rem; }
.remind a:hover { color: var(--brand-ink); }
.remind svg.i { color: var(--close); }
.g3-box { margin-top: 26px; display: flex; gap: 14px; align-items: flex-start; background: var(--brand-tint); border-radius: 14px; padding: 16px 18px; }
.g3-box p { margin: 0; }

.toast {
  position: fixed; left: 50%; bottom: 22px; transform: translate(-50%, 20px); opacity: 0; pointer-events: none;
  background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 10px; font-weight: 700; font-size: .95rem;
  transition: opacity .16s, transform .16s; z-index: 50;
}
.toast.on { opacity: 1; transform: translate(-50%, 0); }
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }

/* ---------- Tablet ---------- */
@media (max-width: 1279px) {
  .app { grid-template-columns: 330px minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); grid-template-areas: "nav nav" "list detail"; }
  .nav { display: flex; gap: 6px; overflow-x: auto; overflow-y: hidden; padding: 8px 14px; border-right: 0; border-bottom: 1px solid var(--line); scrollbar-width: thin; }
  .nav-item { width: auto; white-space: nowrap; padding: 8px 13px; border: 1px solid var(--line); border-radius: 999px; font-size: .9rem; gap: 7px; }
  .nav-item svg.i { width: 17px; height: 17px; }
  .nav-item .n { margin-left: 2px; }
  .nav-sep { display: none; }
  .d { padding: 22px 28px 90px; }
  .script { font-size: 1.22rem; }
  .flow { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
  .brand-txt span { display: none; }
  .icon-btn .t { display: none; }
}
@media (max-width: 1023px) {

          for (const t of f.tokens) {
            for (const v of vs) {
              const q = v.matches.get(t);
              if (q) { hits.add(t); const sc = f.w * v.w * q; if (sc > best) best = sc; }
            }
          }
        }
        if (best > 0) { matched++; sum += best; }
      }
      let bonus = 0;
      if (qn.length >= 4) {
        for (const tag of e.tags) {
          let b = 0;
          if (tag === qn) b = 40;
          else if (tag.length >= 5 && (' ' + qn + ' ').includes(' ' + tag + ' ')) b = 18 + tag.length * 0.3;
          else if (qn.length >= 5 && tag.includes(qn)) b = 14;
          if (b > bonus) bonus = b;
        }
        for (const f of e.f) { if ((f.k === 'titulo' || f.k === 'clienteDice') && f.n.includes(qn)) { bonus += 12; break; } }
      }
      if (!matched && !bonus) continue;
      const cov = matched / groups.length;
      if (!bonus && groups.length >= 3 && cov < 0.5) continue;
      const score = sum * Math.pow(cov, 1.5) + bonus;
      if (score < 3) continue;
      out.push({ s: e.s, score, hits });
    }
    out.sort((a, b) => b.score - a.score);
    const top = out.length ? out[0].score : 0;
    const res = out.filter((r) => r.score >= top * 0.2).slice(0, 30);
    const allHits = new Set(); res.forEach((r) => r.hits.forEach((h) => allHits.add(h)));
    return { raw, qn, results: res, hits: { terms: allHits, phrase: qn.includes(' ') ? qn : '' }, expansions: Array.from(expansions).filter((x) => allHits.has(x)).slice(0, 6) };
  }

  /* ---------- Resaltado + marcadores de datos variables ---------- */
  function ranges(text, H) {
    if (!H || !text || (!H.terms.size && !H.phrase)) return [];
    const n = normChars(text); const out = [];
    const re = /[a-z0-9]+/g; let m;
    const words = [];
    while ((m = re.exec(n))) {
      words.push([m.index, m.index + m[0].length, m[0]]);
      if (H.terms.has(m[0])) out.push([m.index, m.index + m[0].length]);
    }
    if (H.phrase) {
      // Frase completa (incluye palabras cortas como «no», «ya», «yo»)
      const pw = H.phrase.split(' ');
      for (let i = 0; i + pw.length <= words.length; i++) {
        let ok = true;
        for (let k = 0; k < pw.length; k++) { if (words[i + k][2] !== pw[k]) { ok = false; break; } }
        if (ok) out.push([words[i][0], words[i + pw.length - 1][1]]);
      }
    }
    out.sort((a, b) => a[0] - b[0]);
    const merged = [];
    for (const r of out) {
      const last = merged[merged.length - 1];
      if (last && r[0] <= last[1]) last[1] = Math.max(last[1], r[1]); else merged.push([r[0], r[1]]);
    }
    return merged;
  }
  function rich(text, H) {
    text = String(text || '');
    const rs = ranges(text, H);
    let s = '', last = 0;
    for (const [a, b] of rs) { s += text.slice(last, a) + '\u0001' + text.slice(a, b) + '\u0002'; last = b; }
    s += text.slice(last);
    s = esc(s).replace(/\[([^\]]+)\]/g, (m0, inner) => {
      const plain = inner.replace(/[\u0001\u0002]/g, '');
      return '<span class="ph" title="Dato a completar">' + inner + '</span>';
    });
    return s.replace(/\u0001/g, '<mark>').replace(/\u0002/g, '</mark>');
  }
  function snippet(text, H, max) {
    max = max || 150;
    const rs = ranges(text, H);
    if (!rs.length) return null;
    let start = 0;
    if (text.length > max) start = Math.max(0, Math.min(rs[0][0] - 40, text.length - max));
    if (start > 0) { const sp = text.indexOf(' ', start); if (sp > -1 && sp < rs[0][0]) start = sp + 1; }
    let end = Math.min(text.length, start + max);
    if (end < text.length) { const sp = text.lastIndexOf(' ', end); if (sp > start + 40) end = sp; }
    return (start > 0 ? '…' : '') + rich(text.slice(start, end), H) + (end < text.length ? '…' : '');
  }

  async function copyText(t) {

      e.preventDefault();
      st.kb = (st.kb + (e.key === 'ArrowDown' ? 1 : -1) + R.results.length) % R.results.length;
      if (!isNarrow()) { st.sel = R.results[st.kb].s.id; history.replaceState(null, '', '#/e/' + st.sel); renderDetail(); detail.scrollTop = 0; }
      renderList();
    } else if (e.key === 'Enter') {
      e.preventDefault();
      const id = R.results[Math.max(0, st.kb)].s.id;
      st.sel = id; st.view = 'detail';
      history.replaceState(null, '', '#/e/' + id);
      renderAll(true);
      if (isNarrow()) qInput.blur();
    }
  });
  function clearSearch() {
    qInput.value = ''; clearBtn.classList.remove('on');
    st.res = null; st.kb = -1;
    if (st.sel) st.cat = SC[st.sel].categoria;
    renderAll(false);
  }
  clearBtn.addEventListener('click', () => { clearSearch(); qInput.focus(); });

  document.addEventListener('click', (e) => {
    const chip = e.target.closest('[data-q]');
    if (chip) { qInput.value = chip.dataset.q; runSearch(); qInput.focus(); return; }
    if (e.target.closest('[data-back]')) {
      if (st.res) { st.view = 'list'; document.body.classList.add('v-list'); renderList(); }
      else location.hash = '#/c/' + SC[st.sel].categoria;
      return;
    }
    const row = e.target.closest('a.row');
    if (row && st.res) {
      // Mantener la búsqueda activa al abrir un resultado
      e.preventDefault();
      st.sel = row.dataset.id; st.view = 'detail';
      st.kb = st.res.results.findIndex((r) => r.s.id === st.sel);
      history.replaceState(null, '', '#/e/' + st.sel);
      renderAll(true);
    }
  });
  function leaveSearch(e) {
    // Al elegir una categoría o inicio, se limpia la búsqueda
    const a = e.target.closest('a');
    if (!a) return;
    if (st.res) { qInput.value = ''; clearBtn.classList.remove('on'); st.res = null; st.kb = -1; }
    if (a.getAttribute('href') === location.hash) { e.preventDefault(); applyHash(); }
  }
  nav.addEventListener('click', leaveSearch);
  $('.brand').addEventListener('click', leaveSearch);

  document.addEventListener('keydown', (e) => {
    const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
    if ((e.key === '/' && !typing) || ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k')) {
      e.preventDefault(); qInput.focus(); qInput.select();
    }
  });

  /* ---------- Tema claro / oscuro ---------- */
  const themeBtn = $('#theme');
  function effTheme() {
    const a = document.documentElement.getAttribute('data-theme');
    if (a) return a;
    return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }
  function paintThemeBtn() {
    const dark = effTheme() === 'dark';
    themeBtn.innerHTML = ic(dark ? 'sun' : 'moon') + '<span class="t">' + (dark ? 'Modo claro' : 'Modo oscuro') + '</span>';
    themeBtn.setAttribute('aria-label', dark ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro');
  }
  themeBtn.addEventListener('click', () => {
    const next = effTheme() === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    try { localStorage.setItem('ludoteca-tema', next); } catch (e) {}
    paintThemeBtn();
  });
  try { window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', paintThemeBtn); } catch (e) {}
  paintThemeBtn();

  function fitPlaceholder() {
    qInput.placeholder = window.matchMedia('(max-width: 1023px)').matches
      ? 'Lo que dice el cliente: «ya pagué»…'
      : 'Escribe lo que dice el cliente: «no tengo dinero», «ya pagué», «no soy yo»…';
  }
  window.addEventListener('resize', fitPlaceholder);
  fitPlaceholder();

  window.addEventListener('hashchange', applyHash);
  applyHash();
})();
</script>
</body>
</html>
